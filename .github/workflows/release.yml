name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || {
            echo "Release workflow must run from a tag" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag must be SemVer-compatible (for example v1.2.3)" >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          }

      - name: Validate product deployment bundle
        env:
          HOME_MESH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          HOME_MESH_SESSION_SECRET: release-only-session-secret-with-at-least-32-bytes
          HOME_MESH_DNS_SERVER: 127.0.0.53
        run: |
          sh -n deploy/linux/home-mesh.sh
          docker compose -f deploy/linux/compose.yml config --quiet

  images:
    name: Publish ${{ matrix.name }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: web/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Normalize registry namespace
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/home-mesh-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish multiarch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

  bundle:
    name: Publish Linux bundle
    needs:
      - verify
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build release bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="home-mesh-linux-${version}"
          mkdir -p "$bundle/config"
          cp deploy/linux/compose.yml "$bundle/compose.yml"
          cp deploy/linux/home-mesh.sh "$bundle/home-mesh.sh"
          cp deploy/linux/home-mesh.env.example "$bundle/home-mesh.env.example"
          cp deploy/linux/README.md "$bundle/README.md"
          cp config/known_hosts "$bundle/config/known_hosts"
          printf '%s\n' "$version" > "$bundle/VERSION"
          chmod 0755 "$bundle/home-mesh.sh"
          tar -czf "$bundle.tar.gz" "$bundle"
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
          echo "bundle=$bundle.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ steps.bundle.outputs.bundle }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$bundle" "$bundle.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$bundle" "$bundle.sha256" \
              --title "Home Mesh $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
