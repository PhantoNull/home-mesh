name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install pinned analysis tools
        env:
          GOBIN: ${{ runner.temp }}/go-tools/bin
        run: |
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run gosec
        run: gosec -exclude-generated ./...

      - name: Run govulncheck
        run: govulncheck ./...

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOME_MESH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HOME_MESH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate Compose configuration
        env:
          HOME_MESH_DNS_SERVER: 127.0.0.53
        run: |
          docker compose config --quiet
          docker compose -f deploy/linux/compose.yml config --quiet

      - name: Validate Linux management script
        run: sh -n deploy/linux/home-mesh.sh

      - name: Exercise Linux bundle initialization
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/home-mesh-linux-test"
          mkdir -p "$bundle/config"
          cp deploy/linux/compose.yml "$bundle/compose.yml"
          cp deploy/linux/home-mesh.sh "$bundle/home-mesh.sh"
          cp config/known_hosts "$bundle/config/known_hosts"
          printf '1.2.3-test\n' > "$bundle/VERSION"
          sh "$bundle/home-mesh.sh" init > "${RUNNER_TEMP}/home-mesh-init.log"
          test "$(stat -c '%a' "$bundle/.env")" = "600"
          test "$(stat -c '%a' "$bundle/config/known_hosts")" = "644"
          grep -q '^HOME_MESH_IMAGE_TAG=1.2.3-test$' "$bundle/.env"
          docker compose --project-directory "$bundle" \
            --env-file "$bundle/.env" \
            -f "$bundle/compose.yml" config --quiet

  linux-deployment:
    name: Linux product deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build product images
        run: |
          docker build -f Dockerfile.api -t home-mesh-api:linux-smoke .
          docker build -f web/Dockerfile -t home-mesh-web:linux-smoke .

      - name: Start isolated product topology
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/home-mesh-linux.env"
          cat > "$env_file" <<'EOF'
          HOME_MESH_IMAGE_TAG=linux-smoke
          HOME_MESH_API_IMAGE=home-mesh-api
          HOME_MESH_WEB_IMAGE=home-mesh-web
          HOME_MESH_WEB_BIND=127.0.0.1
          HOME_MESH_WEB_PORT=39000
          HOME_MESH_ALLOWED_HOSTS=
          HOME_MESH_PROXY_SUBNET=172.31.253.0/24
          HOME_MESH_PROXY_GATEWAY=172.31.253.1
          HOME_MESH_API_PORT=19090
          HOME_MESH_DNS_SERVER=127.0.0.1
          HOME_MESH_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          HOME_MESH_MASTER_KEY_VERSION=2
          HOME_MESH_PREVIOUS_MASTER_KEYS=
          HOME_MESH_SESSION_SECRET=linux-smoke-session-secret-with-at-least-32-bytes
          HOME_MESH_BOOTSTRAP_ADMIN_USERNAME=root
          HOME_MESH_BOOTSTRAP_ADMIN_PASSWORD=linux-smoke-bootstrap-password
          HOME_MESH_SEED_DEMO_DATA=false
          HOME_MESH_DISCOVERY_ALLOW_PUBLIC=false
          HOME_MESH_SCAN_INTERVAL=30s
          EOF
          chmod 0600 "$env_file"

          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              docker compose --env-file "$env_file" -f deploy/linux/compose.yml ps --all || true
              docker compose --env-file "$env_file" -f deploy/linux/compose.yml logs --no-color api web || true
            fi
            docker compose --env-file "$env_file" -f deploy/linux/compose.yml \
              down --volumes --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker compose --env-file "$env_file" -f deploy/linux/compose.yml \
            up -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:39000/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:39000/api/ready >/dev/null
          curl --fail --silent --show-error http://172.31.253.1:19090/api/ready >/dev/null
          if curl --fail --silent --max-time 2 http://127.0.0.1:19090/api/ready >/dev/null; then
            echo "API unexpectedly listened on loopback instead of only the proxy gateway" >&2
            exit 1
          fi
          test "$(docker compose --env-file "$env_file" -f deploy/linux/compose.yml exec -T api id -u)" != "0"
          test "$(docker compose --env-file "$env_file" -f deploy/linux/compose.yml exec -T web id -u)" != "0"

  containers:
    name: Multiarch image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: web
            dockerfile: web/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build amd64 and arm64 image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/home-mesh-${{ matrix.name }}.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=multiarch-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=multiarch-${{ matrix.name }}
